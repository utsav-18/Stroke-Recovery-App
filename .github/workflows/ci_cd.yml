name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies for OpenCV
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 ffmpeg

      - name: Install Python Dependencies (CPU Torch for speed)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.1.0+cpu torchvision==0.16.0+cpu --index-url https://download.pytorch.org/whl/cpu
          pip install -r backend/requirements.txt
          pip install requests

      - name: Run Backend Integration Tests
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://postgres.awwvhwvjsakixqmatzgc:AllianceProject%4001@aws-0-ap-northeast-2.pooler.supabase.com:5432/postgres' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || '7TSH2GQbOKpLu7rhOBHoCgR9ab0_1AeR_38Nw_d-WF7p9UpkY16MwMNLpRIIuL_g' }}
          DOCTOR_SIGNUP_CODE: ${{ secrets.DOCTOR_SIGNUP_CODE || 'ZIOCD0M84fiZ' }}
        run: |
          python -m uvicorn main:app --host 127.0.0.1 --port 8000 --app-dir backend &
          for i in {1..30}; do
            if curl -s http://127.0.0.1:8000/docs > /dev/null; then
              echo "Backend is ready!"
              break
            fi
            echo "Waiting for backend to start ($i/30)..."
            sleep 1
          done
          python test_final.py

  build-apks:
    name: Build Android APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter (Latest Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Patient App APK
        run: |
          cd flutter_app
          chmod +x android/gradlew
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Build Doctor App APK
        run: |
          cd doctor_app
          chmod +x android/gradlew
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Upload Patient App APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RehabTrack-Patient-App
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

      - name: Upload Doctor App APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RehabTrack-Doctor-App
          path: doctor_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
