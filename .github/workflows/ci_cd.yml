name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies for OpenCV
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install requests

      - name: Run Backend Integration Tests
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DOCTOR_SIGNUP_CODE: ${{ secrets.DOCTOR_SIGNUP_CODE }}
        run: |
          python -m uvicorn main:app --host 127.0.0.1 --port 8000 --app-dir backend &
          sleep 5
          python test_final.py

  build-patient-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Get Flutter Dependencies
        run: |
          cd flutter_app
          flutter pub get

      - name: Build Android APK (Release)
        run: |
          cd flutter_app
          flutter build apk --release

      - name: Upload Patient App APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RehabTrack-Patient-App
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

