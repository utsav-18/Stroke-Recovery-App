name: stroke_recovery_monitoring
description: Stroke recovery monitoring mobile app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.1
  dio: ^5.7.0
  http_parser: ^4.1.0
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  video_compress: ^3.1.4
  cupertino_icons: ^1.0.8
  flutter_secure_storage: ^11.0.0
  shared_preferences: ^2.5.5
  video_player: ^2.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_logo.png

flutter:
  uses-material-design: true
  assets:
    - assets/images/app_logo.png
